[package]
name        = "sp1-ethereum-update-client"
description = "Prove an Ethereum beacon header for a Soroban light client"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
repository  = "https://github.com/cosmos/solidity-ibc-eureka"

[workspace]

[[bin]]
name = "sp1-ethereum-update-client"
test = false

[dependencies]
ethereum-light-client = { path = "../../../packages/ethereum/light-client" }
ethereum-types        = { path = "../../../packages/ethereum/types" }

alloy-primitives = { version = "1.5", default-features = false }
bls12_381        = { version = "0.8.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
hex              = { version = "0.4", default-features = false, features = ["alloc"] }
serde            = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json       = { version = "1", default-features = false, features = ["alloc"] }
sha2             = { version = "0.10", default-features = false }
sp1-zkvm         = { version = "6.1", default-features = true }
thiserror        = { version = "2", default-features = false }

[patch.crates-io]
bls12_381    = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
