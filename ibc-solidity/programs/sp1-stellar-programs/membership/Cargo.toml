[package]
name        = "sp1-stellar-membership"
description = "Verify (non)membership program for sp1-stellar"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
repository  = "https://github.com/cosmos/solidity-ibc-eureka"

[workspace]

[[bin]]
name = "sp1-stellar-membership"
test = false

[dependencies]
stellar-light-client-membership     = { path = "../../../../packages/stellar-light-client/membership", default-features = false }
stellar-light-client-solidity-types = { path = "../../../../packages/stellar-light-client/solidity-types", default-features = false }

sp1-zkvm        = { version = "6.1", default-features = true }
alloy-sol-types = { version = "1.5", default-features = false }

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.0.0" }
sha2-v0-10-9     = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
